<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Player</title>

    <style>
        * { box-sizing: border-box; }
        /* Hide the player skin until the video.js web components are defined so
           the raw <video> never flashes unstyled while scripts load. */
        video-player:not(:defined) { visibility: hidden; }

        /* Loading cover: masks the whole player until the skin is fixed up and
           the custom controls are mounted, so the default video.js skin never
           flashes ("oval" look) before snapping to the final design. */
        .player-loading {
            position: absolute; inset: 0; z-index: 40;
            display: flex; align-items: center; justify-content: center;
            background: #000; transition: opacity .25s ease;
        }
        .player-loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .player-spinner {
            width: 44px; height: 44px; border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .22); border-top-color: #fff;
            animation: player-spin .8s linear infinite;
        }
        @keyframes player-spin { to { transform: rotate(360deg); } }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .player-wrap {
            position: fixed;
            inset: -2px;
            background: #000;
            overflow: hidden;
        }

        body.is-video-fullscreen .player-wrap {
            inset: 0;
        }

        video-skin:fullscreen,
        video-skin:fullscreen #videojsMedia {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
            background: #000 !important;
            border-radius: 0 !important;
            outline: 0 !important;
            box-shadow: none !important;
        }

        video-skin::backdrop,
        video-skin:fullscreen::backdrop,
        #videojsMedia::backdrop {
            background: #000 !important;
        }

        video-player,
        video-skin,
        #videojsMedia {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #videojsMedia {
            object-fit: contain;
            border-radius: 0 !important;
            outline: 0 !important;
            box-shadow: none !important;
        }

        .center-play-button {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 20;
            width: 82px;
            height: 82px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 999px;
            color: #fff;
            background: rgba(0, 0, 0, 0.40);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.50);
            cursor: pointer;
            transition: opacity 160ms ease, transform 160ms ease, background 160ms ease;
        }

        .center-play-button:hover {
            transform: translate(-50%, -50%) scale(1.06);
            background: rgba(0, 0, 0, 0.56);
        }

        .center-play-button.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .center-play-button svg {
            width: 34px;
            height: 34px;
            margin-left: 5px;
            fill: currentColor;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.34));
        }

        .vast-ad-overlay {
            position: absolute;
            inset: 0;
            z-index: 60;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .vast-ad-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .vast-ad-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 65;
            padding: 7px 10px;
            color: #fff;
            background: rgba(0,0,0,0.72);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            pointer-events: none;
        }

        .vast-skip-btn {
            position: absolute;
            right: 14px;
            bottom: 72px;
            z-index: 65;
            padding: 9px 13px;
            color: #fff;
            background: rgba(0,0,0,0.78);
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .vast-skip-btn:disabled {
            cursor: default;
            opacity: 0.72;
        }

        .extra-controls {
            position: absolute;
            right: 72px;
            bottom: 22px;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease;
        }

        .extra-controls.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .control-group {
            position: relative;
        }

        .control-button {
            min-width: 42px;
            height: 34px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .control-button:hover,
        .control-button.active {
            background: rgba(255,255,255,0.18);
        }

        .control-menu {
            position: absolute;
            bottom: calc(100% + 10px);
            right: 0;
            display: none;
            min-width: 170px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 10px;
            background: rgba(7,10,15,0.96);
            box-shadow: 0 16px 36px rgba(0,0,0,0.45);
            backdrop-filter: blur(16px);
        }

        .control-menu.open {
            display: block;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 38px;
            padding: 9px 12px;
            border: 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: transparent;
            color: #eef3ff;
            text-align: left;
            font-size: 13px;
            cursor: pointer;
        }

        .menu-item:last-child {
            border-bottom: 0;
        }

        .menu-item:hover,
        .menu-item.active {
            background: rgba(255,255,255,0.12);
        }

        .menu-item.active::after {
            content: "✓";
            color: #fff;
            font-weight: 800;
        }

        .error {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 24px;
            color: #fff;
            text-align: center;
            background: #000;
        }

        .error.hidden {
            display: none;
        }

        .error i {
            color: #ff1744;
            font-size: 42px;
        }

        .error h3 {
            margin: 0;
            font-size: 22px;
        }

        .error p {
            margin: 0;
            max-width: 560px;
            color: #d7dbe3;
            line-height: 1.45;
        }

        @media (max-width: 640px) {
            .extra-controls {
                right: 50px;
                bottom: 15px;
                gap: 4px;
            }

            .control-button {
                min-width: 38px;
                height: 30px;
                padding: 0 9px;
                font-size: 11px;
            }

            .control-menu {
                min-width: 148px;
            }

            .center-play-button {
                width: 74px;
                height: 74px;
                border: 0;
                background: transparent;
                box-shadow: none;
            }

            .center-play-button:hover {
                transform: translate(-50%, -50%) scale(1.04);
                box-shadow: none;
            }

            .center-play-button svg {
                width: 58px;
                height: 58px;
                margin-left: 4px;
                filter: drop-shadow(0 4px 12px rgba(0,0,0,0.65));
            }
        }
    </style>
</head>
<body>
    <div class="player-wrap">
        <div class="player-loading" id="playerLoading"><div class="player-spinner"></div></div>
        <video-player id="videojsPlayer" autohide="4">
            <video-skin>
                <video id="videojsMedia" preload="metadata" playsinline crossorigin="anonymous"></video>
            </video-skin>
        </video-player>

        <button class="center-play-button" id="centerPlayButton" type="button" aria-label="Oynat" title="Oynat">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5v14l11-7z"></path>
            </svg>
        </button>

        <div class="extra-controls" id="extraControls">
            <div class="control-group" id="qualityGroup" hidden>
                <button class="control-button" id="qualityButton" type="button" title="Kalite">Kalite</button>
                <div class="control-menu" id="qualityMenu"></div>
            </div>
            <div class="control-group" id="audioGroup" hidden>
                <button class="control-button icon-button" id="audioButton" type="button" title="Ses" aria-label="Ses">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 13v-1a8 8 0 0 1 16 0v1"></path>
                        <path d="M4 13v4a2 2 0 0 0 2 2h2v-8H6a2 2 0 0 0-2 2Z"></path>
                        <path d="M20 13v4a2 2 0 0 1-2 2h-2v-8h2a2 2 0 0 1 2 2Z"></path>
                    </svg>
                </button>
                <div class="control-menu" id="audioMenu"></div>
            </div>
            <div class="control-group" id="subtitleGroup" hidden>
                <button class="control-button" id="subtitleButton" type="button" title="Altyazı">CC</button>
                <div class="control-menu" id="subtitleMenu"></div>
            </div>
            <div class="control-group" id="settingsGroup">
                <button class="control-button icon-button" id="settingsButton" type="button" title="Ayarlar" aria-label="Ayarlar">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
                <div class="control-menu settings-menu" id="settingsMenu">
                    <div class="settings-home" id="settingsHome"></div>
                    <div class="settings-header" id="settingsHeader" hidden>
                        <button class="settings-back" id="settingsBack" type="button" aria-label="Geri">‹</button>
                        <span id="settingsTitle"></span>
                    </div>
                    <div class="settings-page" id="speedMenu" hidden></div>
                </div>
            </div>
        </div>

        <div class="error hidden" id="err">
            <svg width="42" height="42" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </svg>
            <h3>Hata</h3>
            <p id="errTxt"></p>
        </div>
    </div>

    <script type="module" src="vendor/videojs/video.js"></script>
    <script src="vendor/hlsjs/hls.min.js"></script>
    <script src="scripts/api.js?v=20260615-referrer-only"></script>
    <script>
        let videoId = null;
        let hls = null;
        let vastPrerollMedia = [];
        let vastPrerollDone = false;
        let vastPrerollRunning = false;
        let resumeState = { enabled: false, key: '', restored: false, lastSave: 0 };
        let playerSkinMounted = false;
        let playerTracksReady = false;

        const playerWrap = document.querySelector('.player-wrap');
        const mediaElement = document.getElementById('videojsMedia');
        const centerPlayButton = document.getElementById('centerPlayButton');
        const extraControls = document.getElementById('extraControls');
        const errorOverlay = document.getElementById('err');
        const errorText = document.getElementById('errTxt');

        const qualityGroup = document.getElementById('qualityGroup');
        const qualityButton = document.getElementById('qualityButton');
        const qualityMenu = document.getElementById('qualityMenu');
        const audioGroup = document.getElementById('audioGroup');
        const audioButton = document.getElementById('audioButton');
        const audioMenu = document.getElementById('audioMenu');
        const subtitleGroup = document.getElementById('subtitleGroup');
        const subtitleButton = document.getElementById('subtitleButton');
        const subtitleMenu = document.getElementById('subtitleMenu');
        const settingsButton = document.getElementById('settingsButton');
        const settingsMenu = document.getElementById('settingsMenu');
        const settingsHome = document.getElementById('settingsHome');
        const settingsHeader = document.getElementById('settingsHeader');
        const settingsTitle = document.getElementById('settingsTitle');
        const speedMenu = document.getElementById('speedMenu');

        // Quality, audio and subtitles live as pages inside the gear menu. The
        // setup*Menu functions keep filling the same elements; the groups' hidden
        // flag still says whether a page has anything to offer.
        [qualityMenu, audioMenu, subtitleMenu].forEach(menu => {
            menu.classList.remove('control-menu');
            menu.classList.add('settings-page');
            menu.hidden = true;
            settingsMenu.appendChild(menu);
        });

        document.addEventListener('DOMContentLoaded', init);
        document.addEventListener('fullscreenchange', syncFullscreenState);
        document.addEventListener('webkitfullscreenchange', syncFullscreenState);
        document.addEventListener('click', event => {
            const path = event.composedPath ? event.composedPath() : [];
            const clickedControl = path.some(node => node?.classList?.contains('control-group') || node?.id === 'extraControls');
            if (!clickedControl) closeMenus();
        });
        centerPlayButton.addEventListener('click', () => {
            mediaElement.play().catch(() => {});
        });

        // Mobile: keep controls on screen ~4s after a tap. The skin hides them
        // almost instantly on touch, so we force them visible for our own window.
        let hlsControlsTimer = null;
        function keepControlsVisibleAfterTap() {
            const skinRoot = document.querySelector('video-skin')?.shadowRoot;
            const controls = skinRoot?.querySelector('media-controls');
            if (!controls) return;
            controls.classList.add('hls-force-show');
            skinRoot.host?.classList?.add('hls-force-show');
            clearTimeout(hlsControlsTimer);
            hlsControlsTimer = setTimeout(() => {
                controls.classList.remove('hls-force-show');
                skinRoot.host?.classList?.remove('hls-force-show');
            }, 4000);
        }
        playerWrap.addEventListener('touchstart', keepControlsVisibleAfterTap, { passive: true });
        playerWrap.addEventListener('touchend', keepControlsVisibleAfterTap, { passive: true });

        function syncFullscreenState() {
            const fullscreenElement = document.fullscreenElement || document.webkitFullscreenElement;
            document.body.classList.toggle('is-video-fullscreen', Boolean(fullscreenElement));
        }

        async function init() {
            // Safety net: never leave the loading cover up indefinitely.
            setTimeout(hidePlayerLoading, 12000);

            const params = new URLSearchParams(window.location.search);
            videoId = params.get('video');

            if (!videoId) {
                showError('Video ID yok');
                return;
            }

            try {
                // Settings and video metadata are independent — fetch them
                // concurrently instead of one after another to cut startup latency.
                const [apiSettings, videoData] = await Promise.all([
                    API.getSettings(),
                    API.getVideo(videoId),
                ]);
                if (videoData.status !== 'completed') {
                    showError('Video hazır değil');
                    return;
                }

                const tokenData = await getVideoToken(videoId);
                const playlistUrl = API.getPlaylistUrl(videoId, tokenData.token, apiSettings, tokenData);

                if (apiSettings.ads_enabled && apiSettings.ads_url) {
                    vastPrerollMedia = await loadVastPrerollMedia(apiSettings.ads_url);
                }

                initVideoJs(playlistUrl, videoData.subtitles || [], apiSettings);
                startControlTranslation();
                mountControlsIntoVideoSkin();
            } catch (error) {
                console.error(error);
                showError('Yükleme hatası: ' + error.message);
            }
        }

        async function getVideoToken(videoId) {
            const params = new URLSearchParams();
            // iOS Safari leaves document.referrer empty for cross-origin iframes,
            // so the token endpoint couldn't see the embed domain and 403'd
            // ("Playback domain is not allowed"). Fall back to ancestorOrigins,
            // a WebKit/Blink feature that still exposes the parent origin there.
            let embedRef = document.referrer;
            if (!embedRef && window.location.ancestorOrigins && window.location.ancestorOrigins.length) {
                embedRef = window.location.ancestorOrigins[0];
            }
            if (embedRef) params.set('embed_referrer', embedRef);

            const query = params.toString() ? `?${params.toString()}` : '';
            const response = await fetch(`${window.location.origin}/api/videos/${videoId}/token${query}`);
            if (!response.ok) {
                let detail = response.statusText;
                try {
                    const data = await response.json();
                    detail = data.detail || detail;
                } catch (error) {
                    // Keep HTTP status text.
                }
                throw new Error(`Failed to get token: ${detail}`);
            }
            return await response.json();
        }

        function initVideoJs(source, subtitles, apiSettings = {}) {
            mediaElement.innerHTML = '';
            addSubtitles(subtitles);
            setupSubtitleMenu();

            mediaElement.addEventListener('play', updateCenterPlayButton);
            mediaElement.addEventListener('pause', updateCenterPlayButton);
            mediaElement.addEventListener('ended', updateCenterPlayButton);
            mediaElement.addEventListener('loadedmetadata', updateCenterPlayButton);
            updateCenterPlayButton();
            setupVastPrerollGate();
            setupResumePlayback(apiSettings);

            mediaElement.addEventListener('canplay', () => {
                extraControls.classList.add('visible');
                mountControlsIntoVideoSkin();
            }, { once: true });

            // Native HLS (Safari/iOS) has no hls.js MANIFEST_PARSED; treat the
            // media metadata being ready as "tracks ready" so the cover lifts
            // only after menus are settled on that path too.
            mediaElement.addEventListener('loadedmetadata', () => {
                playerTracksReady = true;
                setupLanguageButtons();
                maybeRevealPlayer();
            });

            mediaElement.addEventListener('error', () => {
                showError(mediaElement.error?.message || 'Oynatma hatası oluştu');
            });

            trackPlaybackStalls();

            if (window.Hls && Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,
                    // These streams carry audio as a separate rendition, where hls.js
                    // is known to stall on small buffer holes. Let it step over tiny
                    // gaps and retry loads instead of sitting there forever.
                    maxBufferHole: 0.5,
                    nudgeMaxRetry: 8,
                    fragLoadingMaxRetry: 6,
                    levelLoadingMaxRetry: 6,
                    manifestLoadingMaxRetry: 4
                });

                hls.loadSource(source);
                hls.attachMedia(mediaElement);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    setupQualityMenu();
                    setupAudioMenu();
                    extraControls.classList.add('visible');
                    mountControlsIntoVideoSkin();
                    setupLanguageButtons();
                    playerTracksReady = true;
                    maybeRevealPlayer();
                });
                hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, () => { setupAudioMenu(); setupLanguageButtons(); });
                hls.on(Hls.Events.LEVEL_SWITCHED, setupQualityMenu);
                hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, () => { setupAudioMenu(); updateLangButtonsActive(); });
                hls.on(Hls.Events.ERROR, (event, data) => handleHlsError(data));
                hls.on(Hls.Events.FRAG_LOADED, (event, data) => recordSegment(data.frag));
                // hls.js only updates its speed estimate when a segment finishes, so on
                // a very slow line it stays stale. Track the one still downloading.
                hls.on(Hls.Events.FRAG_LOADING, (event, data) => {
                    if (data.frag.type === 'main') playbackStats.segmentStart = Date.now();
                });
                // Safari's ManagedMediaSource tells hls.js to stop loading once the
                // buffer is full and may not say to resume after a seek past it.
                mediaElement.addEventListener('seeking', () => hls.resumeBuffering());
                startStallWatchdog();
                return;
            }

            const sourceElement = document.createElement('source');
            sourceElement.src = source;
            sourceElement.type = 'application/x-mpegURL';
            mediaElement.appendChild(sourceElement);
            mediaElement.load();
            extraControls.classList.add('visible');
        }

        function updateCenterPlayButton() {
            centerPlayButton.classList.toggle('hidden', !mediaElement.paused && !mediaElement.ended);
        }

        function resumeSiteKey(apiSettings) {
            if (apiSettings.active_site_domain) return apiSettings.active_site_domain;
            try {
                return document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, '') : 'default';
            } catch (error) {
                return 'default';
            }
        }

        function setupResumePlayback(apiSettings) {
            resumeState.enabled = Boolean(apiSettings.resume_playback);
            resumeState.key = `hls_resume:${resumeSiteKey(apiSettings)}:${videoId}`;
            resumeState.restored = false;
            resumeState.lastSave = 0;
            if (!resumeState.enabled) {
                try { localStorage.removeItem(resumeState.key); } catch (error) {}
                return;
            }

            mediaElement.addEventListener('loadedmetadata', restorePlaybackPosition);
            mediaElement.addEventListener('canplay', restorePlaybackPosition);
            mediaElement.addEventListener('timeupdate', savePlaybackPosition);
            mediaElement.addEventListener('ended', clearPlaybackPosition);
        }

        function restorePlaybackPosition() {
            if (!resumeState.enabled || resumeState.restored || !Number.isFinite(mediaElement.duration)) return;
            resumeState.restored = true;
            try {
                const saved = Number(localStorage.getItem(resumeState.key) || 0);
                if (saved > 5 && saved < Math.max(0, mediaElement.duration - 10)) {
                    mediaElement.currentTime = saved;
                }
            } catch (error) {}
        }

        function savePlaybackPosition() {
            if (!resumeState.enabled || vastPrerollRunning || !Number.isFinite(mediaElement.duration)) return;
            const now = Date.now();
            if (now - resumeState.lastSave < 5000) return;
            resumeState.lastSave = now;

            const current = mediaElement.currentTime || 0;
            if (current > 5 && current < Math.max(0, mediaElement.duration - 10)) {
                try { localStorage.setItem(resumeState.key, String(Math.floor(current))); } catch (error) {}
            }
        }

        function clearPlaybackPosition() {
            if (!resumeState.key) return;
            try { localStorage.removeItem(resumeState.key); } catch (error) {}
        }

        function vastText(node, tagName) {
            return (node.getElementsByTagName(tagName)[0]?.textContent || '').trim();
        }

        function parseVastDuration(value) {
            const parts = String(value || '').split(':').map(Number);
            if (parts.length !== 3 || parts.some(Number.isNaN)) return 0;
            return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
        }

        function pickVastMediaFiles(xmlText) {
            const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
            if (doc.getElementsByTagName('parsererror').length) return [];

            return Array.from(doc.getElementsByTagName('Ad'))
                .map((ad, index) => {
                    const mediaFiles = Array.from(ad.getElementsByTagName('MediaFile'));
                    if (!mediaFiles.length) return null;

                    const preferred = mediaFiles.find(node => {
                        const url = (node.textContent || '').trim();
                        const type = (node.getAttribute('type') || node.getAttribute('mimeType') || '').toLowerCase();
                        return url && (url.includes('.m3u8') || type.includes('mpegurl') || type.includes('mp4'));
                    }) || mediaFiles[0];

                    const linear = preferred.closest?.('Linear') || ad.getElementsByTagName('Linear')[0];
                    return {
                        url: (preferred.textContent || '').trim(),
                        type: (preferred.getAttribute('type') || preferred.getAttribute('mimeType') || '').toLowerCase(),
                        clickThrough: vastText(ad, 'ClickThrough'),
                        skipAfter: parseVastDuration(linear?.getAttribute('skipoffset') || '00:00:05') || 5,
                        sequence: Number(ad.getAttribute('sequence') || index + 1)
                    };
                })
                .filter(media => media?.url)
                .sort((a, b) => a.sequence - b.sequence);
        }

        async function loadVastPrerollMedia(vastUrl) {
            try {
                const response = await fetch(vastUrl, { cache: 'no-store' });
                if (!response.ok) throw new Error(`VAST ${response.status}`);
                return pickVastMediaFiles(await response.text());
            } catch (error) {
                console.error('VAST preload failed:', error);
                return [];
            }
        }

        function setupVastPrerollGate() {
            if (!vastPrerollMedia.length || mediaElement.dataset.vastPrerollBound) return;
            mediaElement.dataset.vastPrerollBound = '1';
            mediaElement.addEventListener('play', async () => {
                if (vastPrerollDone || vastPrerollRunning || !vastPrerollMedia.length) return;
                vastPrerollRunning = true;
                // The class alone does not hold: pausing the main video below
                // fires updateCenterPlayButton(), which toggles 'hidden' back off
                // because the main video is paused for the whole ad. Use the same
                // inline visibility the report modal uses, which the class toggle
                // cannot undo, and restore it however the ad sequence ends.
                centerPlayButton.style.visibility = 'hidden';
                mediaElement.pause();
                try {
                    await playVastPrerollSequence(vastPrerollMedia);
                } finally {
                    centerPlayButton.style.visibility = '';
                    vastPrerollDone = true;
                    vastPrerollRunning = false;
                }
                mediaElement.play().catch(() => {});
            });
        }

        async function playVastPrerollSequence(mediaItems) {
            for (let index = 0; index < mediaItems.length; index += 1) {
                await playVastPreroll(mediaItems[index], index + 1, mediaItems.length);
            }
        }

        // The fullscreen element is <video-skin>, so anything appended to
        // .player-wrap sits OUTSIDE the fullscreen subtree and is never painted
        // there: the ad kept playing its audio while the screen stayed black,
        // and the skip button was unreachable. Mount the ad layer in the same
        // parent as media-controls, exactly like mountTopOverlay does, and carry
        // its CSS in with it because a shadow root does not inherit document CSS.
        // The .player-wrap fallback keeps the ad working (windowed only) if the
        // skin has not upgraded yet; that is why the document-level .vast-* rules
        // are still needed alongside this copy.
        function getAdMountPoint() {
            const skinRoot = document.querySelector('video-skin')?.shadowRoot;
            if (!skinRoot) return playerWrap;

            if (!skinRoot.getElementById('vast-ad-style')) {
                const style = document.createElement('style');
                style.id = 'vast-ad-style';
                style.textContent = `
                    .vast-ad-overlay{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#000;}
                    .vast-ad-video{width:100%;height:100%;object-fit:contain;background:#000;}
                    .vast-ad-badge{position:absolute;top:14px;left:14px;z-index:65;padding:7px 10px;color:#fff;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.2);border-radius:6px;font-size:13px;font-weight:700;pointer-events:none;}
                    .vast-skip-btn{position:absolute;right:14px;bottom:72px;z-index:65;padding:9px 13px;color:#fff;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.28);border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;}
                    .vast-skip-btn:disabled{cursor:default;opacity:.72;}
                    /* On a phone the control bar is hidden for most of the ad, so the
                       72px reserved for it just leaves the button floating; sit it in
                       the corner instead and scale it down like the other overlays. */
                    @media (max-width:640px){
                        .vast-ad-badge{top:10px;left:10px;padding:5px 8px;font-size:11px;}
                        .vast-skip-btn{right:10px;bottom:18px;padding:8px 11px;font-size:12px;}
                    }
                `;
                skinRoot.appendChild(style);
            }

            const controls = skinRoot.querySelector('media-controls');
            const mediaController = skinRoot.querySelector('media-controller') || skinRoot;
            return (controls && controls.parentElement) || mediaController;
        }

        // The ad layer now sits inside the player's own container, which carries
        // the click-to-play gesture. Without this a click on the ad both opened
        // the advertiser and started the main video behind it. The ad's own
        // handlers still run: they are on descendants, so they fire before this.
        function sealAdClicks(el) {
            ['pointerdown', 'pointerup', 'click'].forEach(type =>
                el.addEventListener(type, event => event.stopPropagation()));
        }

        async function playVastPreroll(media, adIndex = 1, adTotal = 1) {
            let adHls = null;
            let completed = false;
            let skipTimer = null;
            // Held in this scope so cleanup can remove them wherever they were
            // mounted; a shadow-root element is invisible to document.getElementById.
            let badge = null;
            let skipBtn = null;
            const adMount = getAdMountPoint();
            const overlay = document.createElement('div');
            overlay.className = 'vast-ad-overlay';
            overlay.innerHTML = '<video class="vast-ad-video" playsinline autoplay></video>';
            adMount.appendChild(overlay);
            sealAdClicks(overlay);
            const adVideo = overlay.querySelector('video');

            const cleanup = () => {
                clearInterval(skipTimer);
                badge?.remove();
                skipBtn?.remove();
                if (adHls) {
                    try { adHls.destroy(); } catch (error) {}
                    adHls = null;
                }
                adVideo.pause();
                overlay.remove();
            };

            const finish = () => {
                if (completed) return;
                completed = true;
                cleanup();
            };

            try {
                return await new Promise(resolve => {
                    badge = document.createElement('div');
                    badge.id = 'vastAdBadge';
                    badge.className = 'vast-ad-badge';
                    badge.textContent = adTotal > 1 ? `Reklam ${adIndex}/${adTotal}` : 'Reklam';
                    if (media.clickThrough) {
                        badge.style.pointerEvents = 'auto';
                        badge.style.cursor = 'pointer';
                        badge.title = 'Reklama git';
                        badge.addEventListener('click', () => window.open(media.clickThrough, '_blank', 'noopener'));
                    }
                    adMount.appendChild(badge);
                    sealAdClicks(badge);

                    skipBtn = document.createElement('button');
                    skipBtn.id = 'vastSkipBtn';
                    skipBtn.className = 'vast-skip-btn';
                    skipBtn.type = 'button';
                    skipBtn.disabled = true;
                    adMount.appendChild(skipBtn);
                    sealAdClicks(skipBtn);

                    const startedAt = Date.now();
                    const updateSkip = () => {
                        const elapsed = Math.floor((Date.now() - startedAt) / 1000);
                        const remain = Math.max(0, media.skipAfter - elapsed);
                        if (remain > 0) {
                            skipBtn.textContent = `${remain} sn sonra gec`;
                            skipBtn.disabled = true;
                        } else {
                            skipBtn.textContent = 'Reklami gec';
                            skipBtn.disabled = false;
                        }
                    };
                    updateSkip();
                    skipTimer = setInterval(updateSkip, 250);

                    const done = () => {
                        finish();
                        resolve(true);
                    };
                    const showAdError = detail => {
                        console.error('VAST ad playback failed:', detail);
                        skipBtn.textContent = 'Reklami gec';
                        skipBtn.disabled = false;
                        clearInterval(skipTimer);
                    };

                    skipBtn.addEventListener('click', () => {
                        if (!skipBtn.disabled) done();
                    });
                    adVideo.addEventListener('ended', done, { once: true });
                    adVideo.addEventListener('error', () => showAdError(adVideo.error?.message || 'video error'), { once: true });
                    adVideo.addEventListener('click', () => {
                        if (media.clickThrough) window.open(media.clickThrough, '_blank', 'noopener');
                    });

                    const isHlsAd = media.url.includes('.m3u8') || media.type.includes('mpegurl');
                    if (isHlsAd && window.Hls && Hls.isSupported()) {
                        adHls = new Hls();
                        adHls.loadSource(media.url);
                        adHls.attachMedia(adVideo);
                        adHls.on(Hls.Events.MANIFEST_PARSED, () => {
                            const playPromise = adVideo.play();
                            if (playPromise) playPromise.catch(() => showAdError('autoplay blocked'));
                        });
                        adHls.on(Hls.Events.ERROR, (event, data) => {
                            if (data?.fatal) showAdError(`${data.type || 'hls'} ${data.details || ''}`);
                        });
                    } else {
                        adVideo.src = media.url;
                        const playPromise = adVideo.play();
                        if (playPromise) playPromise.catch(() => showAdError('autoplay blocked'));
                    }
                });
            } catch (error) {
                console.error('VAST preroll failed:', error);
                cleanup();
                return false;
            }
        }

        // Measurements sent with a "Sorun Bildir" report, so a freeze complaint can be
        // told apart: viewer's connection, viewer's device, or our servers.
        const playbackStats = {
            startedAt: Date.now(),
            playbackBegan: false,
            stalls: 0,
            stallMs: 0,
            stallStart: 0,
            segmentStart: 0,
            segments: 0,
            slowSegments: 0,
            lastSegment: null,
            hlsErrors: 0,
            lastError: null
        };

        function trackPlaybackStalls() {
            mediaElement.addEventListener('waiting', () => {
                if (playbackStats.playbackBegan && !playbackStats.stallStart) {
                    playbackStats.stallStart = Date.now();
                }
            });
            const stallEnded = () => {
                if (!playbackStats.stallStart) return;
                const stalled = Date.now() - playbackStats.stallStart;
                playbackStats.stallStart = 0;
                // Under a second is a normal seek or a blip, not a freeze.
                if (stalled >= 1000) {
                    playbackStats.stalls++;
                    playbackStats.stallMs += stalled;
                }
            };
            mediaElement.addEventListener('playing', () => {
                playbackStats.playbackBegan = true;
                stallEnded();
            });
            mediaElement.addEventListener('pause', stallEnded);
        }

        function recordSegment(frag) {
            if (!frag || frag.type !== 'main' || !frag.stats) return;
            playbackStats.segmentStart = 0;
            const seconds = (frag.stats.loading.end - frag.stats.loading.start) / 1000;
            playbackStats.segments++;
            // Slower than real time: this segment took longer to fetch than to play.
            if (seconds > frag.duration) playbackStats.slowSegments++;
            let host = '';
            try { host = new URL(frag.url).hostname; } catch (e) {}
            playbackStats.lastSegment = {
                host,
                seconds: Math.round(seconds * 100) / 100,
                bytes: frag.stats.total,
                duration: Math.round(frag.duration * 100) / 100
            };
        }

        function collectPlaybackDiagnostics() {
            const video = mediaElement;
            let buffer = 0;
            for (let i = 0; i < video.buffered.length; i++) {
                if (video.buffered.start(i) <= video.currentTime && video.currentTime <= video.buffered.end(i)) {
                    buffer = video.buffered.end(i) - video.currentTime;
                }
            }
            const levels = hls && Array.isArray(hls.levels) ? hls.levels : [];
            const level = levels[hls ? hls.currentLevel : -1];
            const frames = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null;
            const connection = navigator.connection || {};
            const now = Date.now();
            const openStall = playbackStats.stallStart ? now - playbackStats.stallStart : 0;
            return {
                position: Math.round(video.currentTime),
                duration: Math.round(video.duration) || null,
                paused: video.paused,
                seeking: video.seeking,
                buffering_enabled: hls ? hls.bufferingEnabled : null,
                buffer_seconds: Math.round(buffer * 10) / 10,
                watched_seconds: Math.round((now - playbackStats.startedAt) / 1000),
                stalled_now: openStall >= 1000,
                stalls: playbackStats.stalls + (openStall >= 1000 ? 1 : 0),
                stall_seconds: Math.round((playbackStats.stallMs + openStall) / 1000),
                quality_mode: hls ? (hls.autoLevelEnabled ? 'auto' : 'manual') : 'native',
                quality_height: level ? level.height : null,
                quality_bitrate: level ? level.bitrate : null,
                lowest_bitrate: levels.length ? Math.min(...levels.map(item => item.bitrate)) : null,
                available_heights: levels.map(item => item.height),
                bandwidth_bps: hls ? Math.round(hls.bandwidthEstimate) || null : null,
                pending_segment_seconds: playbackStats.segmentStart ? Math.round((now - playbackStats.segmentStart) / 1000) : 0,
                segments: playbackStats.segments,
                slow_segments: playbackStats.slowSegments,
                last_segment: playbackStats.lastSegment,
                hls_errors: playbackStats.hlsErrors,
                last_error: playbackStats.lastError,
                dropped_frames: frames ? frames.droppedVideoFrames : null,
                total_frames: frames ? frames.totalVideoFrames : null,
                connection_type: connection.effectiveType || null,
                downlink_mbps: connection.downlink ?? null,
                rtt_ms: connection.rtt ?? null,
                save_data: connection.saveData ?? null,
                cpu_cores: navigator.hardwareConcurrency || null,
                memory_gb: navigator.deviceMemory || null,
                screen: `${screen.width}x${screen.height}@${window.devicePixelRatio || 1}`
            };
        }

        function setupQualityMenu() {
            if (!hls || !Array.isArray(hls.levels) || hls.levels.length === 0) {
                qualityGroup.hidden = true;
                return;
            }

            const levels = hls.levels
                .map((level, index) => ({ index, height: level.height || 0, bitrate: level.bitrate || 0 }))
                .sort((a, b) => b.height - a.height || b.bitrate - a.bitrate);

            qualityGroup.hidden = false;
            qualityMenu.innerHTML = '';
            qualityMenu.appendChild(menuItem('Otomatik', hls.currentLevel === -1, () => {
                hls.currentLevel = -1;
                qualityButton.textContent = 'Kalite';
                setupQualityMenu();
            }));

            levels.forEach(level => {
                const label = level.height ? `${level.height}p` : `${Math.round(level.bitrate / 1000)} kbps`;
                qualityMenu.appendChild(menuItem(label, hls.currentLevel === level.index, () => {
                    hls.currentLevel = level.index;
                    qualityButton.textContent = 'Kalite';
                    setupQualityMenu();
                }));
            });

            qualityButton.textContent = 'Kalite';
        }

        function setupAudioMenu() {
            if (!hls || !Array.isArray(hls.audioTracks) || hls.audioTracks.length <= 1) {
                audioGroup.hidden = true;
                return;
            }

            audioGroup.hidden = false;
            audioMenu.innerHTML = '';

            hls.audioTracks.forEach((track, index) => {
                const label = cleanTrackLabel(track.name || track.lang || `Ses ${index + 1}`);
                audioMenu.appendChild(menuItem(label, hls.audioTrack === index, () => {
                    hls.audioTrack = index;
                    setupAudioMenu();
                }));
            });
        }

        function setupSubtitleMenu() {
            const tracks = Array.from(mediaElement.textTracks || []).filter(track => track.kind === 'subtitles' || track.kind === 'captions');
            if (!tracks.length) {
                subtitleGroup.hidden = true;
                return;
            }

            subtitleGroup.hidden = false;
            subtitleMenu.innerHTML = '';
            subtitleMenu.appendChild(menuItem('Kapalı', tracks.every(track => track.mode !== 'showing'), () => {
                tracks.forEach(track => { track.mode = 'disabled'; });
                subtitleButton.textContent = 'CC';
                setupSubtitleMenu();
            }));

            tracks.forEach(track => {
                subtitleMenu.appendChild(menuItem(track.label || 'Altyazı', track.mode === 'showing', () => {
                    tracks.forEach(item => { item.mode = item === track ? 'showing' : 'disabled'; });
                    subtitleButton.textContent = 'CC';
                    setupSubtitleMenu();
                }));
            });
        }

        function addSubtitles(subtitles) {
            subtitles.forEach((subtitle, index) => {
                const url = normalizeSubtitleUrl(subtitle.url || '');
                if (!url) return;

                const track = document.createElement('track');
                track.kind = 'subtitles';
                track.src = url;
                track.srclang = subtitleLangCode(subtitle.lang, index);
                track.label = cleanSubtitleLabel(subtitle.lang || `Altyazı ${index + 1}`);
                track.default = false;
                mediaElement.appendChild(track);
            });

            Array.from(mediaElement.textTracks || []).forEach(track => {
                track.mode = 'disabled';
            });
        }

        function menuItem(label, isActive, onClick) {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = `menu-item${isActive ? ' active' : ''}`;
            item.textContent = label;
            item.addEventListener('click', event => {
                event.stopPropagation();
                onClick();
                closeMenus();
            });
            return item;
        }

        const PLAYBACK_SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];

        function speedLabel(rate) {
            return rate === 1 ? 'Normal' : `${rate}x`;
        }

        function setupSpeedMenu() {
            speedMenu.innerHTML = '';
            PLAYBACK_SPEEDS.forEach(rate => {
                speedMenu.appendChild(menuItem(speedLabel(rate), mediaElement.playbackRate === rate, () => {
                    mediaElement.playbackRate = rate;
                }));
            });
        }

        function currentQualityLabel() {
            const level = hls && Array.isArray(hls.levels) ? hls.levels[hls.currentLevel] : null;
            const height = level && level.height ? `${level.height}p` : '';
            if (hls && hls.autoLevelEnabled) return height ? `Otomatik (${height})` : 'Otomatik';
            return height;
        }

        function currentAudioLabel() {
            const track = hls && Array.isArray(hls.audioTracks) ? hls.audioTracks[hls.audioTrack] : null;
            return track ? cleanTrackLabel(track.name || track.lang || '') : '';
        }

        function currentSubtitleLabel() {
            const showing = Array.from(mediaElement.textTracks || []).find(track => track.mode === 'showing');
            return showing ? (showing.label || 'Altyazı') : 'Kapalı';
        }

        const settingsPages = [
            { title: 'Kalite', menu: qualityMenu, available: () => !qualityGroup.hidden, value: currentQualityLabel },
            { title: 'Ses', menu: audioMenu, available: () => !audioGroup.hidden, value: currentAudioLabel },
            { title: 'Altyazı', menu: subtitleMenu, available: () => !subtitleGroup.hidden, value: currentSubtitleLabel },
            { title: 'Hız', menu: speedMenu, available: () => true, value: () => speedLabel(mediaElement.playbackRate) }
        ];

        function showSettingsHome() {
            settingsHome.innerHTML = '';
            settingsPages.filter(page => page.available()).forEach(page => {
                const entry = document.createElement('button');
                entry.type = 'button';
                entry.className = 'settings-entry';
                const name = document.createElement('span');
                name.textContent = page.title;
                const value = document.createElement('span');
                value.className = 'settings-value';
                value.textContent = `${page.value() || ''} ›`;
                entry.append(name, value);
                entry.addEventListener('click', event => {
                    event.stopPropagation();
                    showSettingsPage(page);
                });
                settingsHome.appendChild(entry);
            });
            settingsHome.hidden = false;
            settingsHeader.hidden = true;
            settingsPages.forEach(page => { page.menu.hidden = true; });
        }

        function showSettingsPage(page) {
            settingsHome.hidden = true;
            settingsHeader.hidden = false;
            settingsTitle.textContent = page.title;
            settingsPages.forEach(item => { item.menu.hidden = item !== page; });
        }

        settingsButton.addEventListener('click', event => {
            event.stopPropagation();
            const willOpen = !settingsMenu.classList.contains('open');
            closeMenus();
            if (!willOpen) return;
            showSettingsHome();
            settingsMenu.classList.add('open');
            settingsButton.classList.add('active');
        });

        document.getElementById('settingsBack').addEventListener('click', event => {
            event.stopPropagation();
            showSettingsHome();
        });

        mediaElement.addEventListener('ratechange', setupSpeedMenu);
        setupSpeedMenu();

        function closeMenus() {
            extraControls.querySelectorAll('.control-menu.open').forEach(menu => menu.classList.remove('open'));
            extraControls.querySelectorAll('.control-button.active').forEach(button => button.classList.remove('active'));
        }

        function mountControlsIntoVideoSkin() {
            const skinRoot = document.querySelector('video-skin')?.shadowRoot;
            if (!skinRoot) {
                setTimeout(mountControlsIntoVideoSkin, 250);
                return;
            }

            injectVideoSkinFixes(skinRoot);

            // Keep the controls on screen longer after a tap (default ~2s felt
            // like they vanished instantly on mobile). media-chrome reads the
            // `autohide` attribute (seconds) on its controller.
            const controller = skinRoot.querySelector('media-controller')
                || document.querySelector('video-player')
                || skinRoot.host;
            try { controller?.setAttribute('autohide', '4'); } catch (e) {}

            const controls = skinRoot.querySelector('media-controls');
            if (!controls) {
                setTimeout(mountControlsIntoVideoSkin, 250);
                return;
            }

            const nativeCaptions = skinRoot.querySelector('media-captions-button');
            const targetGroup = nativeCaptions?.parentElement || skinRoot.querySelector('media-cast-button')?.parentElement || controls;

            if (buildControlLayout(skinRoot, controls)) {
                // extraControls now sits in the new right-hand button group.
            } else if (extraControls.parentNode !== targetGroup) {
                const insertBefore = nativeCaptions?.nextSibling || skinRoot.querySelector('media-cast-button') || skinRoot.querySelector('media-pip-button') || skinRoot.querySelector('media-fullscreen-button');
                if (insertBefore && insertBefore.parentElement === targetGroup) {
                    targetGroup.insertBefore(extraControls, insertBefore);
                } else {
                    targetGroup.appendChild(extraControls);
                }
            }

            extraControls.classList.add('visible');
            translateControlText();
            mountTopOverlay(skinRoot);
            mountCenterPlayButton(skinRoot);
            playerSkinMounted = true;
            maybeRevealPlayer();
        }

        // The centre play button shipped in .player-wrap, i.e. outside <video-skin>,
        // which is the element that goes fullscreen - so pausing in fullscreen showed
        // no play button at all. Move the existing node into the fullscreen subtree
        // (its CSS has to come along; a shadow root does not inherit document styles).
        // Every script reference goes through the const captured at startup, so moving
        // the node keeps all of them working.
        function mountCenterPlayButton(skinRoot) {
            if (!skinRoot || skinRoot.getElementById('hls-center-play-style')) return;

            const style = document.createElement('style');
            style.id = 'hls-center-play-style';
            style.textContent = `
                .center-play-button{position:absolute;left:50%;top:50%;z-index:20;width:82px;height:82px;padding:0;display:inline-flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.55);border-radius:999px;color:#fff;background:rgba(0,0,0,.4);box-shadow:0 8px 30px rgba(0,0,0,.5);cursor:pointer;transition:opacity 160ms ease,transform 160ms ease,background 160ms ease;}
                .center-play-button:hover{transform:translate(-50%,-50%) scale(1.06);background:rgba(0,0,0,.56);}
                .center-play-button.hidden{opacity:0;pointer-events:none;}
                .center-play-button svg{width:34px;height:34px;margin-left:5px;fill:currentColor;}
                @media (max-width:640px){
                    .center-play-button{width:74px;height:74px;border:0;background:transparent;box-shadow:none;}
                    .center-play-button:hover{transform:translate(-50%,-50%) scale(1.04);box-shadow:none;}
                    .center-play-button svg{width:58px;height:58px;margin-left:4px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.65));}
                }
            `;
            skinRoot.appendChild(style);

            const controls = skinRoot.querySelector('media-controls');
            const parent = (controls && controls.parentElement) || skinRoot;
            parent.appendChild(centerPlayButton);
            // It now lives inside the player container, so a tap on it would also
            // reach the player's own click-to-play gesture and cancel itself out.
            sealAdClicks(centerPlayButton);
        }

        // Top overlay (Sorun Bildir + Türkçe Dublaj/Altyazı) lives INSIDE the
        // skin's shadow root so it also renders in fullscreen (the fullscreen
        // element is <video-skin>). It is a fully isolated layer with its own
        // <style>; it never touches media-controls, so it can't destabilise
        // playback the way editing the skin's own control CSS did.
        function mountTopOverlay(skinRoot) {
            if (!skinRoot || skinRoot.getElementById('hls-top-overlay')) return;

            const style = document.createElement('style');
            style.id = 'hls-top-overlay-style';
            style.textContent = `
                .hls-topbar{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:10px;padding:14px 16px;box-sizing:border-box;background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0));transition:opacity .2s ease;pointer-events:none;}

        let langDefaultApplied = false;

        function langIsTurkish(value) {
            const s = (value || '').toString().toLowerCase();
            return s.includes('türk') || s.includes('turk') || s.includes('türkçe')
                || s.includes('turkce') || s === 'tr' || s.startsWith('tr-') || s.startsWith('tr_');

                        if (trAudio < 0) trAudio = i;
                    } else if (origAudio < 0) {
                        origAudio = i;
                    }
                });
            }
            let trSub = null;
            Array.from(mediaElement.textTracks || []).forEach(t => {
                if ((t.kind === 'subtitles' || t.kind === 'captions')
                    && (langIsTurkish(t.label) || langIsTurkish(t.language)) && !trSub) {
                    trSub = t;
                }

        function updateLangButtonsActive() {
            const root = window.__hlsTopOverlay && window.__hlsTopOverlay.skinRoot;

            const dub = root.getElementById('hlsDubBtn');

            const { trAudio, trSub } = getLangTracks();
            const audioTurkish = hls && trAudio >= 0 && hls.audioTrack === trAudio;
            const subShowing = !!(trSub && trSub.mode === 'showing');
            if (dub) dub.classList.toggle('active', audioTurkish && !subShowing);
            if (sub) sub.classList.toggle('active', subShowing);

        function applyLangMode(mode) {
            const { trAudio, origAudio, trSub } = getLangTracks();
            if (mode === 'dub') {

                Array.from(mediaElement.textTracks || []).forEach(t => {
                    if (t.kind === 'subtitles' || t.kind === 'captions') t.mode = 'disabled';
                });

                if (hls && origAudio >= 0) hls.audioTrack = origAudio;
                Array.from(mediaElement.textTracks || []).forEach(t => {

            const mute = skinRoot.querySelector('media-mute-button');

            // pair together so the tooltip still renders next to its button.

        function normalizeSubtitleUrl(url) {
            if (!url) return '';
            if (/^https?:\/\//i.test(url)) return url;
            return `${window.location.origin}${url.startsWith('/') ? '' : '/'}${url}`;
        }

        function subtitleLangCode(label, index) {
            const value = String(label || '').toLowerCase();
            if (value.includes('turkish') || value.includes('türk') || value.includes('tur')) return 'tr';
            if (value.includes('english') || value.includes('ingiliz') || value.includes('eng')) return 'en';
            return `sub-${index + 1}`;
        }

        function cleanSubtitleLabel(label) {
            const parts = String(label || '').split(' - ').map(part => part.trim()).filter(Boolean);
            if (parts.length >= 2 && parts[0].toLowerCase() === parts[1].toLowerCase()) {
                return parts[0];
            }
            return label || 'Altyazı';
        }

        function cleanTrackLabel(label) {
            const value = cleanSubtitleLabel(label);
            if (/^tur$/i.test(value)) return 'Türkçe';
            if (/^eng$/i.test(value)) return 'English';
            return value;
        }

        function startControlTranslation() {
            translateControlText();
            setTimeout(translateControlText, 500);
            setTimeout(translateControlText, 1500);
            let ticks = 0;
            const timer = setInterval(() => {
                translateControlText();
                ticks += 1;
                if (ticks >= 8) clearInterval(timer);
            }, 1000);

            const observer = new MutationObserver(() => translateControlText());
            observer.observe(document.documentElement, {
                childList: true,
                subtree: true,
                characterData: true,
                attributes: true,
                attributeFilter: ['aria-label', 'title', 'label']
            });
        }

        function translateControlText() {
            const dictionary = {

            const roots = [document];
            document.querySelectorAll('*').forEach(element => {
                if (element.shadowRoot) roots.push(element.shadowRoot);
            });

            roots.forEach(root => {
                root.querySelectorAll('*').forEach(element => {
                    ['aria-label', 'title', 'label'].forEach(attr => {
                        const value = element.getAttribute?.(attr);
                        if (value && dictionary[value]) element.setAttribute(attr, dictionary[value]);

                    if (element.childNodes.length === 1 && element.firstChild.nodeType === Node.TEXT_NODE) {
                        const text = element.textContent.trim();
                        if (dictionary[text]) element.textContent = dictionary[text];
                    }
                });
            });

        // --- Playback recovery -------------------------------------------------
        // Previously any hls.js error was either ignored (non-fatal) or turned
        // straight into an error message (fatal), with no attempt to recover. A
        // single transient hiccup — a slow fragment, a small buffer hole in the
        // separate audio rendition — therefore killed playback permanently, which
        // is exactly what viewers describe ("stuck in the same spot"). On a fast,
        // stable line these hiccups almost never happen, which is why it never
        // reproduces here. Recover the way hls.js documents instead.
        let hlsRecoverCount = 0;
        let hlsRecoverWindowStart = 0;

        function handleHlsError(data) {
            if (!data) return;
            playbackStats.hlsErrors++;
            playbackStats.lastError = String(data.details || data.type || '').slice(0, 80);
            // Non-fatal errors are left to hls.js / the stall watchdog below.
            if (!data.fatal) return;

            const now = Date.now();
            if (!hlsRecoverWindowStart || now - hlsRecoverWindowStart > 60000) {
                hlsRecoverWindowStart = now;
                hlsRecoverCount = 0;
            }
            hlsRecoverCount++;

            // Only give up after repeated failures inside one minute.
            if (hlsRecoverCount > 6) {
                showError('Oynatma hatası oluştu');
                return;
            }

            try {
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    hls.startLoad();
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    if (hlsRecoverCount > 2) {
                        try { hls.swapAudioCodec(); } catch (e) {}
                    }
                    hls.recoverMediaError();
                } else {
                    showError('Oynatma hatası oluştu');
                }
            } catch (e) {
                showError('Oynatma hatası oluştu');
            }
        }

        // Watchdog: if the media element says it is playing but the clock is not
        // moving, nudge it over the gap; escalate to a reload if it stays stuck.
        let stallWatchdogTimer = null;
        function startStallWatchdog() {
            if (stallWatchdogTimer) return;
            let lastTime = -1;
            let stalledSeconds = 0;
            stallWatchdogTimer = setInterval(() => {
                if (!mediaElement || mediaElement.paused || mediaElement.ended || mediaElement.seeking || mediaElement.readyState === 0) {
                    lastTime = -1;
                    stalledSeconds = 0;
                    return;
                }
                const t = mediaElement.currentTime;
                if (lastTime >= 0 && Math.abs(t - lastTime) < 0.01) {
                    stalledSeconds++;
                    if (stalledSeconds === 3) nudgePlayback();
                    else if (stalledSeconds >= 8) {
                        stalledSeconds = 0;
                        try { hls && hls.startLoad(); } catch (e) {}
                        nudgePlayback();
                    }
                } else {
                    stalledSeconds = 0;
                }
                lastTime = t;
            }, 1000);
        }

        function nudgePlayback() {
            try {
                const t = mediaElement.currentTime;
                const buffered = mediaElement.buffered;
                // Jump to the start of the next buffered range if we are sitting in a hole.
                for (let i = 0; i < buffered.length; i++) {
                    const start = buffered.start(i);
                    if (start > t && start - t < 10) {
                        mediaElement.currentTime = start + 0.1;
                        mediaElement.play().catch(() => {});
                        return;
                    }
                }
                mediaElement.currentTime = t + 0.1;
                mediaElement.play().catch(() => {});
            } catch (e) {}
        }

        function showError(message) {
            hidePlayerLoading();
            errorText.textContent = message;
            errorOverlay.classList.remove('hidden');
        }
